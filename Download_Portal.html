<body>
    <contaner>
        <header>
            <p id="alinha-texto-logo">Itaguai Construções Navais</p>
        </header>

        <nav class="navbar navbar-expand-md navbar-dark bg-dark" id="alinha-nav">
            Busca de Documentos
        </nav>
    
        <section> 
            <div id="alinha-options">
                <p>Options:
                    <input type="radio" name="option_test" id="option_test" checked>
                    <label for="Download">Download</label>
                    <input type="radio" name="option_test" id="option_test">
                    <label for="Inativo">Inativo</label>
                </p>
            </div>

            <div id="sep1">
                
                <p><strong>Busca de Portal:</strong>
                    <input type="text" name="sep-text" id="sep-text">
                </p>
                <div> 
                    <p id="p-alinha-button">  
                        <button type="button" class="btn btn-secondary" id="bt1" onclick="analisa()">Buscar</button>
                        <button type="button" class="btn btn-warning" id="bt1" onclick="limpar()">Limpar</button>
                    </p>
                </div>
            </div>
            <div>
                <hr>
                <p><strong>Lista:</strong></p>
                <p id="result"></p>
				<table>
				<tr><strong id="var_res"><strong></tr>
				</table>
				<a href="#"></a>
            </div>
        </section> 

    </contaner>
</body>
<!--###########################################################-->
<script>
    function analisa(){
		
		var in_text = document.getElementById('sep-text')
        var res = document.getElementById('result')
		var res1 = document.getElementById('var_res')
        var new_text = ''
        var list_breaked = []
        var match_test = in_text.value.split(/\s+/)
        var option_test = document.getElementsByName('option_test')
		let link_portal = ("http://api-doc.icnavais.net/document/downloadGeral/lastRevision?number=")
        
        res.innerHTML = ''
		res1.innerHTML = ''
		
		if (option_test[0].checked){
			// Libera a análise de separação

			if (in_text.value.length == 0){
                window.alert('[ERRO] - É preciso preencher os campos par análise')
            }else{
			
				for (let a=0; a<match_test.length; a++){
                    new_text = match_test[a]
                    list_breaked[a] = new_text 
                }
				
                for (let a=0; a<list_breaked.length; a++){
					
					res1.innerHTML += '<td>' + list_breaked[a] + '</td><br>'
					window.open(link_portal + list_breaked[a])
                }
				
				res1.innerHTML += '<br><br>Não Esqueça de Verificar sua Pasta de Downloads!'
			}

		}
		else if (option_test[1].checked){
           // Libera a análise de separação
		   window.alert('Função temporariamente Desabilitada')
		}
			
	}

	function limpar(){
        //window.alert("ok")

        var in_text = document.getElementById('sep-text')
        var res = document.getElementById('result')
		var res1 = document.getElementById('var_res')
        res.innerHTML = ''
		res1.innerHTML = ''
        in_text.value = ''
    }
	

</script>
